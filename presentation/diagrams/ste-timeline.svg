<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 80 900 195" width="900" height="195">
  <title>My STE rule: Opus 5 ships 24 Jul, rule added 29 Aug, Opus 5.5 ships 22 Sep, rule dropped 27 Sep</title>
  <style>
    text { font-family: "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #fff; text-anchor: middle; }
    .date { font-size: 26px; font-weight: 700; }
    .event { font-size: 24px; }
    .era { font-size: 20px; }
    .axis { stroke: #ddd; stroke-width: 3; }
    /* Each dot shares the colour of its model's bar. */
    .opus5 { fill: #6b6b6b; }
    .opus55 { fill: #86bc25; }
    .era55 { fill: #000; }
  </style>
  <line class="axis" x1="30" y1="150" x2="870" y2="150"/>

  <circle class="opus5" cx="120" cy="150" r="12"/>
  <text class="date" x="120" y="112">24 Jul</text>
  <text class="event" x="120" y="196">Opus 5 ships</text>

  <circle class="opus5" cx="340" cy="150" r="12"/>
  <text class="date" x="340" y="112">29 Aug</text>
  <text class="event" x="340" y="196">Added</text>

  <circle class="opus55" cx="560" cy="150" r="12"/>
  <text class="date" x="560" y="112">22 Sep</text>
  <text class="event" x="560" y="196">Opus 5.5 ships</text>

  <circle class="opus55" cx="780" cy="150" r="12"/>
  <text class="date" x="780" y="112">27 Sep</text>
  <text class="event" x="780" y="196">Dropped</text>

  <rect class="opus5" x="120" y="226" width="440" height="44"/>
  <rect class="opus55" x="560" y="226" width="310" height="44"/>
  <text class="era" x="340" y="255">Opus 5</text>
  <text class="era era55" x="715" y="255">Opus 5.5</text>
</svg>
