<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 900 360" width="900" height="360">
  <title>The unlearning experiment: the same cases run through three arms (baseline: old model with scaffolding; candidate: new model with scaffolding; deleted: new model without scaffolding). Comparing them tells you to keep, unlearn or add.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ddd"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #fff; text-anchor: middle; }
    .name { font-size: 24px; font-weight: 700; }
    .sub { font-size: 18px; fill: #c8c8c8; }
    .box { fill: #1c1c1c; stroke: #ddd; stroke-width: 2; }
    .arm { fill: #1d2a0b; stroke: #86bc25; stroke-width: 2.5; }
    .out { fill: #111; stroke: #86bc25; stroke-width: 2.5; }
    .outtext { font-size: 24px; font-weight: 700; fill: #86bc25; }
    .flow { stroke: #ddd; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  </style>

  <rect class="box" x="20" y="170" width="140" height="80" rx="8"/>
  <text class="name" x="90" y="218">Cases</text>

  <rect class="arm" x="235" y="40" width="300" height="80" rx="8"/>
  <text class="name" x="385" y="74">Baseline</text>
  <text class="sub" x="385" y="102">old model + scaffolding</text>

  <rect class="arm" x="235" y="170" width="300" height="80" rx="8"/>
  <text class="name" x="385" y="204">Candidate</text>
  <text class="sub" x="385" y="232">new model + scaffolding</text>

  <rect class="arm" x="235" y="300" width="300" height="80" rx="8"/>
  <text class="name" x="385" y="334">Deleted</text>
  <text class="sub" x="385" y="362">new model, scaffolding removed</text>

  <rect class="box" x="590" y="170" width="130" height="80" rx="8"/>
  <text class="name" x="655" y="218">Compare</text>

  <rect class="out" x="780" y="62" width="110" height="56" rx="28"/>
  <text class="outtext" x="835" y="98">Keep</text>
  <rect class="out" x="780" y="182" width="110" height="56" rx="28"/>
  <text class="outtext" x="835" y="218">Unlearn</text>
  <rect class="out" x="780" y="302" width="110" height="56" rx="28"/>
  <text class="outtext" x="835" y="338">Add</text>

  <path class="flow" d="M160,210 C200,210 200,80 233,80"/>
  <line class="flow" x1="160" y1="210" x2="233" y2="210"/>
  <path class="flow" d="M160,210 C200,210 200,340 233,340"/>

  <path class="flow" d="M535,80 C565,80 565,210 588,210"/>
  <line class="flow" x1="535" y1="210" x2="588" y2="210"/>
  <path class="flow" d="M535,340 C565,340 565,210 588,210"/>

  <path class="flow" d="M720,210 C750,210 750,90 778,90"/>
  <line class="flow" x1="720" y1="210" x2="778" y2="210"/>
  <path class="flow" d="M720,210 C750,210 750,330 778,330"/>
</svg>
