# Procedure: an app team asks how to rotate a database password.
# The notes are messy on purpose. The ground truth is the how-to we want.
input: |
  Turn these notes from a Slack thread into a how-to for app teams on the Tui
  platform: "How do I rotate my service's Postgres password without downtime?"

  Notes:
  - tui db creds can do it, `tui db creds create --service <name>` makes a
    second credential and both work at the same time
  - you need the db-admin role on the service or the create fails
  - the secrets operator syncs it into the namespace as the `<name>-db` secret
    but that takes up to 5 mins, people keep restarting too early
  - then `kubectl rollout restart deployment/<name>` so the pods pick up the
    new secret
  - check with `tui db creds list --service <name>`, the new one gets a
    last-used timestamp once the pods are on it
  - ONLY THEN `tui db creds revoke --service <name> --id <old-id>`. revoking
    first = outage, the payments team found that out the hard way in March
  - max 2 creds per service so you have to revoke the old one before you can
    rotate again
expected: |
  # Rotate the database password for a service

  You must have the db-admin role for the service.

  1. Create a second credential: `tui db creds create --service <name>`. The
     old credential and the new credential both work.
  2. Wait 5 minutes. The secrets operator copies the new credential to the
     `<name>-db` secret in your namespace.
  3. Restart the deployment: `kubectl rollout restart deployment/<name>`.
  4. Make sure that the pods use the new credential:
     `tui db creds list --service <name>`. The new credential shows a
     last-used time.
  5. Revoke the old credential:
     `tui db creds revoke --service <name> --id <old-id>`.

  CAUTION: Do not revoke the old credential before the pods use the new
  credential. If you do, the service stops.

  A service can have a maximum of 2 credentials. Revoke the old credential
  before the next rotation.
metadata:
  category: procedure
